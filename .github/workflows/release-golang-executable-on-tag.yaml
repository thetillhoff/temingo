name: Release Golang executable on tag

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release_body:
        description: >-
          Release notes. Left empty (the default), the CHANGELOG section for the
          tag is used instead. Callers that cannot add a CHANGELOG entry - a bot
          commit cannot land on protected main - pass their own text here.
        required: false
        type: string
        default: ""

env:
  TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

jobs:
  release-prerequisites:
    runs-on: ubuntu-latest
    outputs:
      RELEASE_BODY: ${{ inputs.release_body != '' && inputs.release_body || steps.release-prerequisites.outputs.RELEASE_BODY }}
    steps:
      # The action's only job is to find the CHANGELOG section for the tag, so it
      # is skipped when the caller already supplied the body.
      - id: release-prerequisites
        if: ${{ inputs.release_body == '' }}
        uses: thetillhoff/action-release-prerequisites@2c4e295d06d4b8ce6fe2bdf6a1b7e806d7c1687c # v0.4.1
        with:
          RELEASE_TAG: ${{ env.TAG }}

  golang-build:
    needs: release-prerequisites
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        os:
          - linux
          - windows
          - darwin
        arch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: thetillhoff/action-golang-build@63a1bfaa47f4f5c94c6b642b0723111128a9c118 # v1.0.1
        with:
          OS: "${{ matrix.os }}"
          ARCH: "${{ matrix.arch }}"
          BUILDARGS: -ldflags="-X github.com/thetillhoff/temingo/cmd.version=${{ env.TAG }}"

  verify-version:
    needs: golang-build
    runs-on: ubuntu-latest
    steps:
      - name: Download linux/amd64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact_temingo_linux_amd64
          path: .

      - name: Verify version
        shell: bash
        run: |
          chmod +x ./temingo_linux_amd64

          # Check version using --version flag
          VERSION_OUTPUT=$(./temingo_linux_amd64 --version 2>&1 || echo "dev")
          VERSION_OUTPUT=$(echo "$VERSION_OUTPUT" | tr -d '\n\r' | xargs)  # Trim whitespace and newlines

          echo "Version output: '$VERSION_OUTPUT'"

          # Verify version matches the tag (this also catches "dev" since it won't match)
          EXPECTED_VERSION="${{ env.TAG }}"
          if [[ "$VERSION_OUTPUT" != "$EXPECTED_VERSION" ]]; then
            echo "ERROR: Version mismatch! Expected: '$EXPECTED_VERSION', Got: '$VERSION_OUTPUT'"
            exit 1
          fi

          echo "✓ Version verification passed: $VERSION_OUTPUT"

  cleanup-on-failure:
    needs:
      - release-prerequisites
      - golang-build
      - verify-version
    if: always() && (needs.release-prerequisites.result == 'failure' || needs.golang-build.result == 'failure' || needs.verify-version.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Delete tag on failure
        shell: bash
        run: |
          git config --global user.name 'GithubActions'
          git config --global user.email 'githubactions@users.noreply.github.com'
          git push --delete origin "${{ env.TAG }}"
          echo "Deleted tag: ${{ env.TAG }}"

  release-artifacts:
    needs:
      - golang-build
      - verify-version
      - release-prerequisites
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body: "${{ needs.release-prerequisites.outputs.RELEASE_BODY }}"
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ./*

  build-docker-image:
    needs:
      - golang-build
      - verify-version
      - release-prerequisites
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifact_temingo_linux_*
          path: ./artifacts
          merge-multiple: true

      - name: Make binaries executable
        shell: bash
        run: |
          chmod +x ./artifacts/temingo_linux_*

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-external-updates:
    needs: release-artifacts
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl "https://goreportcard.com/checks" \
            -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "repo=${{ github.repository }}"

      - name: Trigger homebrew tap update workflow
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_ACCESS_TOKEN }}
        run: |
          gh workflow run update-temingo.yml \
            --repo thetillhoff/homebrew-tap
